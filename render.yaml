# Render Blueprint（可选；也可在 Dashboard 手动配置）
services:
  - type: web
    name: telegram-customer-registry-bot
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install && pnpm prisma generate && pnpm build
    startCommand: pnpm prisma migrate deploy && node dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: APP_TIMEZONE
        value: Asia/Yangon
      - key: ADMIN_INITIAL_USERNAME
        value: admin
      - key: ADMIN_JWT_EXPIRES_IN
        value: 8h
      - key: ENABLE_SWAGGER
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_OPERATOR_IDS
        sync: false
      - key: TELEGRAM_ENTRY_CHAT_IDS
        sync: false
      - key: TELEGRAM_ARCHIVE_CHAT_ID
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: ADMIN_SYSTEM_OPERATOR_TELEGRAM_ID
        sync: false
      - key: ADMIN_CORS_ORIGINS
        sync: false
